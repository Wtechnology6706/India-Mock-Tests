const examQuestions = ex => BANK[ex.bank];
function evaluate(ex, answers, timeUsed) {
  const qs = examQuestions(ex);
  let correct = 0, wrong = 0, skip = 0; const secs = {};
  qs.forEach((q, i) => {
    const s = secs[q.sec] || (secs[q.sec] = { name:q.sec, total:0, correct:0, wrong:0, skip:0 });
    s.total++;
    const a = answers[i];
    if (a === undefined) { skip++; s.skip++; }
    else if (a === q.a) { correct++; s.correct++; }
    else { wrong++; s.wrong++; }
  });
  const max = qs.length * ex.mark.c;
  const score = Math.max(0, +(correct * ex.mark.c - wrong * ex.mark.w).toFixed(2));
  const attempted = correct + wrong;
  const acc = attempted ? Math.round(correct / attempted * 100) : 0;
  const pct = +Math.min(99.6, 18 + (score / max) * 80 + Math.min(acc, 100) * 0.015).toFixed(1);
  const cohort = 48230;
  const rank = Math.max(1, Math.round((100 - pct) / 100 * cohort) + 1);
  return { ex, answers, correct, wrong, skip, score, max, acc, pct, rank, cohort, timeUsed, secs: Object.values(secs) };
}

function SearchBox({ go, id, after }) {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const hits = q.trim() ? EXAMS.filter(e => (e.title + ' ' + e.cat).toLowerCase().includes(q.trim().toLowerCase())).slice(0, 5) : [];
  const submit = e => { e.preventDefault(); if (!q.trim()) return; const v = q.trim(); setQ(''); setOpen(false); after && after(); go('exams', { q: v }); };
  return html`<form class="relative w-full" role="search" onSubmit=${submit}>
    <label class="sr-only" for=${id}>Search exams</label>
    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none"><${Icon} n="search" s=${16} /></span>
    <input id=${id} class="search" type="search" autocomplete="off" placeholder="Search exams" value=${q} onInput=${e => { setQ(e.target.value); setOpen(true); }} onFocus=${() => setOpen(true)} onBlur=${() => setTimeout(() => setOpen(false), 150)} />
    ${open && q.trim() && html`<div class="dd !left-0 !right-0 !min-w-0 pop" role="listbox">
      ${hits.length ? hits.map(e => html`<button type="button" key=${e.id} class="dd-item" onMouseDown=${ev => ev.preventDefault()} onClick=${() => { setQ(''); setOpen(false); after && after(); go('instructions', { id:e.id }); }}>
        <span class="mt-0.5 text-pri"><${Icon} n="search" s=${16} /></span><span class="min-w-0"><b class="truncate block">${e.title}</b><span class="sub">${e.cat} · ${e.price === 0 ? 'Free' : inr(e.price)}</span></span></button>`)
        : html`<p class="px-3 py-2 text-sm text-muted">No exam matches "${q}". Press Enter to search the directory.</p>`}
    </div>`}
  </form>`;
}

function MegaMenu({ go, close, mode }) {
  const pyq = mode === 'pyq';
  const [ci, setCi] = useState(0);
  const cat = MENU[ci];
  const live = EXAMS[0];
  const itemsOf = g => pyq ? pyqItems() : g.items;
  const off = (g, it) => !g.id || (!pyq && !!it[2]);
  const pick = (g, it) => { close(); if (pyq) go('pyq', { cat:cat.key, exam:g.exam, year:it[0] }); else go('instructions', { id:g.id, level:g.exam + ' · ' + it[0] }); };
  return html`<div class="mega pop" role="region" aria-label=${pyq ? 'Previous year papers' : 'Mock test categories'}>
    <div class="max-w-6xl mx-auto px-4 py-6 grid gap-6 lg:grid-cols-[250px_1fr]">
      <ul class="flex flex-col gap-1" role="tablist" aria-orientation="vertical">
        ${MENU.map((c, i) => html`<li key=${c.key}><button role="tab" aria-selected=${i === ci} class=${cx('mega-tab', i === ci && 'on')} onMouseEnter=${() => setCi(i)} onFocus=${() => setCi(i)} onClick=${() => setCi(i)}>
          <span class="mega-ico"><${Icon} n=${c.icon} s=${19} /></span>
          <span class="min-w-0"><b class="block leading-tight">${c.key}</b><span class="text-xs text-muted">${c.blurb}</span></span>
          <${Icon} n="right" s=${15} cls="ml-auto opacity-50 shrink-0" /></button></li>`)}
      </ul>
      <div class="min-w-0 rise" key=${ci}>
        <div class="flex items-end justify-between gap-4 flex-wrap pb-4 border-b border-line">
          <div><p class="text-[11px] font-bold uppercase tracking-[.18em] text-muted">${pyq ? 'Select exam and paper year' : 'Select target exam and level'}</p><h3 class="text-2xl font-extrabold mt-0.5">${cat.key} ${pyq ? 'previous year papers' : 'mock series'}</h3></div>
          <button class="font-bold text-acc inline-flex items-center gap-1.5 hover:underline underline-offset-4" onClick=${() => { close(); go(pyq ? 'pyq' : 'exams', { cat:cat.key }); }}>${pyq ? 'View all ' + cat.key + ' papers' : 'View all ' + cat.key + ' tests'} <${Icon} n="arrow" s=${16} /></button>
        </div>
        <div class="grid gap-x-5 gap-y-6 pt-5" style=${{ gridTemplateColumns:'repeat(auto-fit,minmax(185px,1fr))' }}>

/* ---------- charts ---------- */
function TrendChart({ data }) {
  const W = 520, H = 220, L = 34, R = 14, T = 14, B = 30;
  const xs = i => L + (data.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (data.length - 1));
  const ys = v => T + (100 - v) * (H - T - B) / 100;
  const pts = data.map((d, i) => [xs(i), ys(d.v)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length - 1][0]} ${H - B} L${pts[0][0]} ${H - B} Z`;
  const last = pts[pts.length - 1];
  return html`<div class="tbl-wrap"><svg viewBox=${`0 0 ${W} ${H}`} style=${{ width:'100%', minWidth:'320px', height:'auto', display:'block' }} role="img" aria-label="Accuracy trend across recent tests">
    ${[0,25,50,75,100].map(t => html`<g key=${t}><line x1=${L} x2=${W - R} y1=${ys(t)} y2=${ys(t)} style=${{ stroke:'var(--line)' }} stroke-width="1" /><text x=${L - 6} y=${ys(t) + 4} text-anchor="end" font-size="11" style=${{ fill:'var(--muted)' }}>${t}</text></g>`)}
    <path d=${area} style=${{ fill:'var(--acc)', opacity:.16 }} />
    <path d=${line} fill="none" style=${{ stroke:'var(--acc)' }} stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
    ${pts.map((p, i) => html`<g key=${i}><circle cx=${p[0]} cy=${p[1]} r=${i === pts.length - 1 ? 6 : 4} style=${{ fill:'var(--surface)', stroke:'var(--acc)' }} stroke-width="2.5" />
      <text x=${p[0]} y=${H - 10} text-anchor="middle" font-size="11" style=${{ fill:'var(--muted)' }}>${data[i].l}</text></g>`)}
    <text x=${Math.min(last[0], W - 24)} y=${last[1] - 12} text-anchor="middle" font-size="12" font-weight="700" style=${{ fill:'var(--fg)' }}>${data[data.length - 1].v}%</text>
  </svg></div>`;
}
function Donut({ parts, size = 150, center, sub }) {
  const r = 52, c = 2 * Math.PI * r; const tot = parts.reduce((a, p) => a + p.v, 0) || 1; let off = 0;
  return html`<svg width=${size} height=${size} viewBox="0 0 140 140" role="img" aria-label=${parts.map(p => p.l + ' ' + p.v).join(', ')}>
    <circle cx="70" cy="70" r=${r} fill="none" style=${{ stroke:'var(--line)' }} stroke-width="16" />
    ${parts.map((p, i) => { const len = p.v / tot * c; const el = html`<circle key=${i} cx="70" cy="70" r=${r} fill="none" style=${{ stroke:p.c }} stroke-width="16" stroke-dasharray=${len + ' ' + (c - len)} stroke-dashoffset=${-off} transform="rotate(-90 70 70)" />`; off += len; return el; })}
    <text x="70" y="68" text-anchor="middle" font-size="22" font-weight="800" style=${{ fill:'var(--fg)' }}>${center}</text>
    <text x="70" y="86" text-anchor="middle" font-size="10" style=${{ fill:'var(--muted)' }}>${sub}</text></svg>`;
}

      <${Sel} id="f-subj" label="Subject" v=${subj} set=${setSubj} opts=${subjects} />
      <${Sel} id="f-month" label="Live from" v=${month} set=${setMonth} opts=${[['All','Any month'],['2026-10','Oct 2026'],['2026-11','Nov 2026'],['2026-12','Dec 2026']]} />
      <div class="flex gap-2 items-end min-w-0"><${Sel} id="f-price" label="Price" v=${price} set=${setPrice} opts=${['All','Free','Paid']} />
      <${Sel} id="f-diff" label="Level" v=${diff} set=${setDiff} opts=${[['All','Any'],['1','Easy'],['2','Moderate'],['3','Hard']]} /></div>
    </div>
    <div class="flex items-center justify-between mt-5 mb-3"><p class="text-sm text-muted" aria-live="polite">${list.length} test${list.length === 1 ? '' : 's'} found</p><button class="text-sm font-semibold text-pri underline underline-offset-2" onClick=${reset}>Reset filters</button></div>
    ${list.length ? html`<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${list.map(e => html`<div key=${e.id} class="relative">
        ${e.demo && html`<span class="badge bg-soft text-muted absolute -top-2 right-4 z-10 !normal-case">Demo question set</span>`}<${ExamCard} ex=${e} go=${go} /><p class="text-xs text-muted mt-2 px-1">Live from ${fmtDate(e.live)}</p></div>`)}</div>`
      : html`<div class="card p-10 text-center"><h3 class="font-bold text-lg">No tests match these filters</h3><p class="text-muted mt-1">Try a different subject or reset the filters.</p><button class="btn btn-pri mt-4" onClick=${reset}>Reset filters</button></div>`}

}

function Exam({ ex, lang, onFinish, level }) {
  const qs = examQuestions(ex); const t = UI[lang];
  const total = ex.mins * 60;
  const [i, setI] = useState(0);
  const [ans, setAns] = useState({});
  const [vis, setVis] = useState({ 0: true });
  const [mrk, setMrk] = useState({});
  const [left, setLeft] = useState(total);
  const [pal, setPal] = useState(false);
  const [confirm, setConfirm] = useState(false);
  useEffect(() => { const id = setInterval(() => setLeft(l => l - 1), 1000); return () => clearInterval(id); }, []);
  useEffect(() => { if (left <= 0) onFinish(ans, total); }, [left]);
  const goTo = n => { setVis(v => ({ ...v, [n]: true })); setI(n); setPal(false); };
  const next = () => goTo(Math.min(qs.length - 1, i + 1));
  const stat = k => { const a = ans[k] !== undefined, m = mrk[k]; return a && m ? 'pal-am' : m ? 'pal-m' : a ? 'pal-a' : vis[k] ? 'pal-na' : 'pal-nv'; };
  const counts = { 'pal-nv':0, 'pal-na':0, 'pal-a':0, 'pal-m':0, 'pal-am':0 };
  qs.forEach((_, k) => counts[stat(k)]++);
  const q = qs[i];
  const choose = o => setAns(a => ({ ...a, [i]: o }));
  const clear = () => setAns(a => { const b = { ...a }; delete b[i]; return b; });
  const low = left <= 120;
  return html`<div class="min-h-screen flex flex-col bg-bg">
    <header class="bg-surface text-fg border-b border-line sticky z-20" style=${{ top:'env(safe-area-inset-top, 0px)' }}>
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <div class="min-w-0 flex items-center gap-3"><span class="hidden sm:block shrink-0"><${LogoMark} h=${36} solid=${true} /></span><div class="min-w-0"><b class="font-display block truncate">${ex.title}</b><span class="text-xs text-muted">${level ? level + ' · ' : ''}${qs.length} questions · Section: ${q.sec}</span></div></div>
        <div class="flex items-center gap-3 shrink-0">
          <div class=${cx('px-3 py-1.5 rounded-lg text-center', low ? 'bg-bad text-white' : 'bg-accsoft text-acc')} role="timer"><span class="block text-[10px] uppercase tracking-wider opacity-80">${t.time}</span><b class="font-display text-xl tnum leading-none">${mmss(left)}</b></div>
          <button class="btn btn-ghost !py-2 md:hidden text-sm" onClick=${() => setPal(!pal)}><${Icon} n="list" s=${16} /></button>
        </div>
      </div>
      <div class="h-1" style=${{ background:'var(--line)' }}><div class="h-full bg-acc" style=${{ width:(left / total * 100) + '%', transition:'width 1s linear' }}></div></div>
    </header>
    <div class="max-w-7xl mx-auto w-full px-4 py-5 grid gap-5 md:grid-cols-[1fr_300px] flex-1 items-start">
      <main class="card p-5 sm:p-7 min-w-0 flex flex-col gap-5" key=${i}>
        <div class="flex items-center justify-between gap-3 flex-wrap"><span class="badge bg-soft text-pri">Question ${i + 1} of ${qs.length}</span><span class="text-xs text-muted tnum">+${ex.mark.c} / −${ex.mark.w}</span></div>
        <h2 class="text-xl sm:text-2xl font-bold leading-snug !font-body rise">${q.q}</h2>
        <div class="grid gap-3" role="radiogroup" aria-label="Options">${q.o.map((o, k) => html`<button key=${k} role="radio" aria-checked=${ans[i] === k} class=${cx('opt', ans[i] === k && 'sel')} onClick=${() => choose(k)}><span class="opt-key">${'ABCD'[k]}</span><span class="pt-0.5">${o}</span></button>`)}</div>
        <div class="flex flex-wrap gap-2 pt-4 border-t border-line">
          <button class="btn btn-ghost" onClick=${() => { setMrk(m => ({ ...m, [i]: true })); next(); }}><${Icon} n="flag" s=${16} /> ${t.mark}</button>
          <button class="btn btn-ghost" onClick=${clear} disabled=${ans[i] === undefined}>${t.clear}</button>
          <button class="btn btn-acc sm:ml-auto" onClick=${() => { setMrk(m => ({ ...m, [i]: false })); next(); }}>${t.save} <${Icon} n="arrow" s=${16} /></button>
        </div>
        <div class="flex justify-between">
          <button class="btn btn-ghost !py-2 text-sm" onClick=${() => goTo(Math.max(0, i - 1))} disabled=${i === 0}><${Icon} n="left" s=${16} /> ${t.prev}</button>
          <button class="btn btn-ghost !py-2 text-sm" onClick=${() => goTo(Math.min(qs.length - 1, i + 1))} disabled=${i === qs.length - 1}>${lang === 'hi' ? 'अगला' : 'Next'} <${Icon} n="right" s=${16} /></button>
        </div>
      </main>
      <aside class=${cx('card p-4 flex flex-col gap-4 md:sticky md:top-24', pal ? 'block order-first' : 'hidden', 'md:flex md:order-none')}>
        <h3 class="font-bold">${t.pal}</h3>
        <div class="grid grid-cols-5 gap-2">${qs.map((_, k) => html`<button key=${k} class=${cx('pal', stat(k), k === i && 'cur')} onClick=${() => goTo(k)} aria-label=${'Question ' + (k + 1)}>${k + 1}</button>`)}</div>
        <ul class="grid grid-cols-2 gap-x-3 gap-y-2 text-xs">${[['pal-a','Answered'],['pal-na','Not answered'],['pal-nv','Not visited'],['pal-m','Marked'],['pal-am','Answered + marked']].map(([c, l]) => html`<li key=${c} class="flex items-center gap-2"><span class=${cx('pal !w-6 !h-6 !text-[11px] shrink-0 !cursor-default hover:!transform-none', c)}>${counts[c]}</span>${l}</li>`)}</ul>
        <button class="btn btn-pri w-full" onClick=${() => setConfirm(true)}>${t.submit}</button>
      </aside>
    </div>
    ${confirm && html`<div class="fixed inset-0 z-50 grid place-items-center p-4" style=${{ background:'rgba(8,10,30,.6)' }} role="dialog" aria-modal="true" aria-label="Confirm submission">
      <div class="card p-6 max-w-md w-full pop"><h2 class="text-xl font-extrabold">Submit your test?</h2>
        <p class="text-muted text-sm mt-1">You cannot change answers after submitting.</p>
        <dl class="grid grid-cols-2 gap-3 my-5 text-center tnum">${[['Answered', counts['pal-a'] + counts['pal-am'], 'text-ok'],['Not answered', counts['pal-na'] + counts['pal-nv'] + counts['pal-m'] - (qs.length - Object.keys(ans).length - counts['pal-na'] - counts['pal-nv'] > 0 ? 0 : 0), 'text-bad']].map(([l, v, c]) => html`<div key=${l} class="rounded-xl bg-bg p-3"><dd class=${cx('text-3xl font-display font-extrabold', c)}>${l === 'Answered' ? v : qs.length - Object.keys(ans).length}</dd><dt class="text-xs text-muted">${l}</dt></div>`)}</dl>
        <p class="text-sm mb-5">Marked for review: <b>${Object.values(mrk).filter(Boolean).length}</b> · Time left: <b class="tnum">${mmss(left)}</b></p>
        <div class="flex gap-3"><button class="btn btn-ghost flex-1" onClick=${() => setConfirm(false)}>Go back</button><button class="btn btn-acc flex-1" onClick=${() => onFinish(ans, total - left)}>Yes, submit</button></div>
      </div></div>`}
  </div>`;
}

function Result({ res, go, bookmarks, toggleBm }) {
  const [tab, setTab] = useState('summary');
  const [flt, setFlt] = useState('all');
  const qs = examQuestions(res.ex);
  const kind = i => res.answers[i] === undefined ? 'skip' : res.answers[i] === qs[i].a ? 'ok' : 'bad';
  const shown = qs.map((q, i) => ({ q, i })).filter(({ i }) => flt === 'all' || kind(i) === flt);
  const msg = res.pct >= 80 ? 'Excellent. You are in the top band of this cohort.' : res.pct >= 55 ? 'Good attempt. A few focused topics will lift your rank.' : 'A solid start. Review the solutions below and retake in a few days.';
  return html`<div class="max-w-5xl mx-auto px-4 pt-10 rise">
    <p class="text-sm font-semibold text-muted">${res.ex.title}${res.level ? ' · ' + res.level : ''}</p>
    <h1 class="text-3xl sm:text-4xl font-extrabold">Your result</h1>
    <div class="flex gap-2 mt-5 border-b border-line" role="tablist">${[['summary','Performance summary'],['solutions','Detailed solutions']].map(([k, l]) => html`<button key=${k} role="tab" aria-selected=${tab === k} onClick=${() => setTab(k)} class=${cx('px-4 py-2.5 font-semibold border-b-2 -mb-px transition-colors', tab === k ? 'border-acc text-fg' : 'border-transparent text-muted hover:text-fg')}>${l}</button>`)}</div>
    ${tab === 'summary' ? html`<div class="grid gap-5 mt-6 pop">
      <div class="rounded-2xl bg-hero text-white p-6 sm:p-8 grid gap-6 md:grid-cols-[auto_1fr] items-center hero-grid">
        <div><p class="text-sm text-white/70">Score</p><p class="font-display font-extrabold tnum leading-none" style=${{ fontSize:'4rem' }}>${res.score}<span class="text-2xl text-white/60"> / ${res.max}</span></p><p class="mt-3 text-white/85 max-w-xs">${msg}</p></div>
        <dl class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">${[['Accuracy', res.acc + '%'],['Percentile', res.pct],['Rank', '#' + res.rank.toLocaleString('en-IN')],['Time used', mmss(res.timeUsed)]].map(([l, v]) => html`<div key=${l} class="rounded-xl p-3" style=${{ background:'rgba(255,255,255,.12)' }}><dd class="font-display text-2xl font-extrabold tnum">${v}</dd><dt class="text-xs text-white/70">${l}</dt></div>`)}</dl>
      </div>
      <p class="text-xs text-muted -mt-2">Percentile and rank are estimated against a sample cohort of ${res.cohort.toLocaleString('en-IN')} aspirants.</p>
      <div class="grid gap-5 md:grid-cols-[320px_1fr]">
        <div class="card p-5 flex flex-col items-center gap-4"><h2 class="font-bold self-start">Attempt breakdown</h2>
          <${Donut} parts=${[{ l:'Correct', v:res.correct, c:'var(--ok)' },{ l:'Incorrect', v:res.wrong, c:'var(--bad)' },{ l:'Skipped', v:res.skip, c:'var(--line)' }]} center=${res.correct + '/' + qs.length} sub="correct" />
          <ul class="text-sm grid gap-1.5 w-full">${[['Correct', res.correct, 'var(--ok)'],['Incorrect', res.wrong, 'var(--bad)'],['Skipped', res.skip, 'var(--muted)']].map(([l, v, c]) => html`<li key=${l} class="flex justify-between"><span class="inline-flex items-center gap-2"><span class="w-3 h-3 rounded-sm" style=${{ background:c }}></span>${l}</span><b class="tnum">${v}</b></li>`)}</ul></div>
        <div class="card p-5 grid gap-4 content-start"><h2 class="font-bold">Section-wise performance</h2>
          ${res.secs.map(s => html`<${Bar} key=${s.name} label=${s.name} v=${s.correct} max=${s.total} color=${s.correct / s.total >= .6 ? 'var(--ok)' : 'var(--acc)'} right=${s.correct + ' / ' + s.total + ' correct'} />`)}
          <p class="text-sm text-muted pt-2 border-t border-line">${(() => { const w = [...res.secs].sort((a, b) => a.correct / a.total - b.correct / b.total)[0]; return 'Weakest section: ' + w.name + '. Open the solutions tab and filter by incorrect or skipped questions to revise it.'; })()}</p></div>
      </div>
      <div class="flex flex-wrap gap-3"><button class="btn btn-acc" onClick=${() => setTab('solutions')}>View solutions</button><button class="btn btn-ghost" onClick=${() => go('instructions', { id: res.ex.id, level: res.level })}>Retake test</button><button class="btn btn-ghost" onClick=${() => go('dashboard')}>Go to dashboard</button></div>
    </div>` : html`<div class="mt-6 grid gap-4 pop">
      <div class="flex flex-wrap gap-2">${[['all','All'],['ok','Correct'],['bad','Incorrect'],['skip','Skipped']].map(([k, l]) => html`<button key=${k} class=${cx('chip', flt === k && 'on')} onClick=${() => setFlt(k)}>${l} <span class="tnum opacity-70">${k === 'all' ? qs.length : qs.filter((_, i) => kind(i) === k).length}</span></button>`)}</div>
      ${shown.length === 0 && html`<div class="card p-8 text-center text-muted">Nothing in this filter.</div>`}
      ${shown.map(({ q, i }) => { const k = kind(i); return html`<article key=${i} class="card p-5 grid gap-4" style=${{ borderLeft:'5px solid ' + (k === 'ok' ? 'var(--ok)' : k === 'bad' ? 'var(--bad)' : 'var(--muted)') }}>

function Auth({ mode, go, onAuth, notify }) {
  const reg = mode === 'register';
  const [f, setF] = useState({ name:'', email:'', phone:'', pw:'', pw2:'', exam:'BPSC TRE 4.0 2026', terms:false, remember:true });
  const [touched, setTouched] = useState({});
  const [show, setShow] = useState(false);
  const E = {
    name: reg && f.name.trim().length < 2 ? 'Enter your full name' : '',
    email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email) ? 'Enter a valid email address' : '',
    phone: reg && !/^[6-9]\d{9}$/.test(f.phone) ? 'Enter a 10-digit mobile number starting with 6 to 9' : '',
    pw: f.pw.length < 8 ? 'Use at least 8 characters' : '',
    pw2: reg && f.pw2 !== f.pw ? 'Passwords do not match' : '',
    terms: reg && !f.terms ? 'Accept the terms to continue' : ''
  };
  const set = k => e => setF({ ...f, [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
  const blur = k => () => setTouched(t => ({ ...t, [k]: true }));
  const bad = Object.values(E).some(Boolean);
  const submit = e => { e.preventDefault(); setTouched({ name:1, email:1, phone:1, pw:1, pw2:1, terms:1 }); if (!bad) onAuth({ name: reg ? f.name.trim() : f.email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()), email: f.email }); };
  const Field = ({ k, label, type = 'text', ph, ac, extra }) => html`<div class="flex flex-col gap-1.5"><label for=${'a-' + k} class="text-sm font-bold">${label}</label>
    <div class="relative"><input id=${'a-' + k} type=${k.startsWith('pw') && show ? 'text' : type} autocomplete=${ac} placeholder=${ph} value=${f[k]} onInput=${set(k)} onBlur=${blur(k)} aria-invalid=${!!(touched[k] && E[k])} class=${cx('field', touched[k] && (E[k] ? 'err' : 'good'))} />
      ${touched[k] && !E[k] && html`<span class="absolute right-3 top-1/2 -translate-y-1/2 text-ok"><${Icon} n="check" s=${18} /></span>`}${extra}</div>
    ${touched[k] && E[k] && html`<p class="text-sm text-bad" role="alert">${E[k]}</p>`}</div>`;
  return html`<div class="max-w-5xl mx-auto px-4 pt-10 rise grid gap-8 lg:grid-cols-[1fr_1.1fr] items-start">
    <div class="hidden lg:flex flex-col gap-5 rounded-2xl hero-light border border-line p-8 self-stretch justify-center"><${LogoFull} w=${230} /><h1 class="text-4xl font-extrabold leading-tight">${reg ? 'Start with two free full mocks.' : 'Welcome back. Your streak is waiting.'}</h1>
      <ul class="grid gap-3 text-muted">${['Real exam-style timer and palette','Solutions in short, clear steps','Rank and percentile after every test'].map(t => html`<li key=${t} class="flex gap-3"><span class="text-acc"><${Icon} n="check" /></span>${t}</li>`)}</ul></div>
    <form class="card p-6 sm:p-8 grid gap-4" onSubmit=${submit} noValidate>
      <div><h2 class="text-2xl font-extrabold">${reg ? 'Create your account' : 'Log in'}</h2><p class="text-sm text-muted mt-1">${reg ? 'Already registered?' : 'New here?'} <button type="button" class="font-semibold text-pri underline underline-offset-2" onClick=${() => go(reg ? 'login' : 'register')}>${reg ? 'Log in' : 'Create an account'}</button></p></div>
      <div class="grid grid-cols-2 gap-3"><button type="button" class="btn btn-ghost" onClick=${() => notify('Google sign-in is a placeholder in this prototype')}><${Icon} n="globe" s=${16} /> Google</button><button type="button" class="btn btn-ghost" onClick=${() => notify('Mobile OTP login is a placeholder in this prototype')}><${Icon} n="user" s=${16} /> Mobile OTP</button></div>
      <div class="flex items-center gap-3 text-xs text-muted"><span class="flex-1 h-px bg-line"></span>or use email<span class="flex-1 h-px bg-line"></span></div>
      ${reg && html`${Field({ k:'name', label:'Full name', ph:'Aarti Kumari', ac:'name' })}`}
      ${Field({ k:'email', label:'Email', type:'email', ph:'you@example.com', ac:'email' })}
      ${reg && html`${Field({ k:'phone', label:'Mobile number', type:'tel', ph:'98765 43210', ac:'tel' })}`}
      ${Field({ k:'pw', label:'Password', type:'password', ph:'At least 8 characters', ac: reg ? 'new-password' : 'current-password' })}
      ${reg && html`${Field({ k:'pw2', label:'Confirm password', type:'password', ph:'Repeat password', ac:'new-password' })}`}
      <label class="flex items-center gap-2 text-sm cursor-pointer w-fit" for="showpw"><input id="showpw" type="checkbox" class="w-4 h-4 accent-[var(--pri)]" checked=${show} onChange=${e => setShow(e.target.checked)} /> Show password</label>
      ${reg && html`<label class="flex flex-col gap-1.5 text-sm font-bold" for="a-exam">Which exam are you preparing for?<select id="a-exam" class="field font-medium" value=${f.exam} onChange=${set('exam')}>${['BPSC TRE 4.0 2026','STET 2026','Banking','UPSC','SSC','Railways','Other'].map(o => html`<option key=${o}>${o}</option>`)}</select></label>
        <div><label class="flex items-start gap-2.5 text-sm cursor-pointer" for="a-terms"><input id="a-terms" type="checkbox" class="mt-0.5 w-4 h-4 accent-[var(--pri)]" checked=${f.terms} onChange=${set('terms')} /> I agree to the Terms of Use and Privacy Policy.</label>${touched.terms && E.terms && html`<p class="text-sm text-bad mt-1" role="alert">${E.terms}</p>`}</div>`}
      ${!reg && html`<div class="flex items-center justify-between text-sm"><label class="flex items-center gap-2 cursor-pointer" for="rem"><input id="rem" type="checkbox" class="w-4 h-4 accent-[var(--pri)]" checked=${f.remember} onChange=${set('remember')} /> Remember me</label><button type="button" class="font-semibold text-pri" onClick=${() => notify('Password reset email is a placeholder in this prototype')}>Forgot password?</button></div>`}
      <button class="btn btn-acc w-full text-base" type="submit">${reg ? 'Create account' : 'Log in'}</button>
    </form>
  </div>`;
}

}

  return html`<div class="max-w-6xl mx-auto px-4 pt-10 rise">
    <p class="text-xs font-bold uppercase tracking-widest text-acc">Learn</p>
    <h1 class="text-3xl sm:text-4xl font-extrabold mt-1">Tutorials and study material</h1>
    <p class="text-muted mt-1 max-w-2xl">Lessons, notes and guides that match the tests you take. Sample titles shown in this prototype.</p>
    <div class="flex gap-2 overflow-x-auto pb-2 mt-6" role="tablist">
      <button role="tab" aria-selected=${type === 'all'} class=${cx('chip !text-sm !px-4 !py-2', type === 'all' && 'on')} onClick=${() => setType('all')}>All</button>
      ${TUT.map(t => html`<button key=${t[0]} role="tab" aria-selected=${type === t[0]} class=${cx('chip !text-sm !px-4 !py-2', type === t[0] && 'on')} onClick=${() => setType(t[0])}>${t[1]}</button>`)}</div>
    <div class="grid gap-4 mt-5 sm:grid-cols-2 lg:grid-cols-3">${list.map(i => html`<article key=${i.t} class="card p-5 flex flex-col gap-3 lift">
      <div class="flex items-center justify-between gap-2"><span class="mega-ico"><${Icon} n=${icon[i.type]} s=${19} /></span><span class="badge bg-soft text-muted">${i.cat}</span></div>
      <h3 class="font-bold text-lg leading-snug flex-1">${i.t}</h3>
      <p class="text-sm text-muted">${i.m} · ${i.e}</p>
      <button class="btn btn-ghost !py-2 text-sm self-start" onClick=${() => notify('Opening study material is a placeholder in this prototype')}>Open <${Icon} n="arrow" s=${15} /></button></article>`)}</div>
    <div class="rounded-2xl bg-acc text-accfg p-8 mt-10 flex flex-col sm:flex-row sm:items-center justify-between gap-5 hero-grid"><div><h2 class="text-2xl font-extrabold">Learned something? Test it.</h2><p class="opacity-90">Apply the lesson in a timed mock.</p></div><button class="btn btn-inv shrink-0" onClick=${() => go('exams')}>Browse mock tests</button></div>
  </div>`;
}

function About({ go }) {
  return html`<div class="rise">
    <section class="hero-light"><div class="max-w-6xl mx-auto px-4 py-14 grid gap-8 lg:grid-cols-[1.2fr_.8fr] items-center">
      <div class="flex flex-col gap-4"><span class="badge bg-acc text-accfg self-start">About us</span>
        <h1 class="text-4xl sm:text-5xl font-extrabold leading-[1.05]">Honest practice for people preparing for a <span class="text-acc">government job</span>.</h1>
        <p class="text-lg text-muted max-w-xl">India Mock Tests started with a simple idea: the test screen should never be a surprise on exam day. We build mocks that look, time and score like the real thing.</p></div>

    <${Section} kicker="What we believe" title="Three promises">
      <div class="grid gap-4 md:grid-cols-3">${[
        ['target','Pattern first','Question mix, marking and timing follow the latest published pattern, and we say when a test is only a practice set.'],

      ].map(([i, t, d]) => html`<div key=${t} class="card p-6 flex flex-col gap-3"><span class="mega-ico"><${Icon} n=${i} s=${20} /></span><h3 class="text-lg font-bold">${t}</h3><p class="text-muted">${d}</p></div>`)}</div><//>
    <${Section} kicker="In numbers" title="Where we are today">
      <dl class="grid grid-cols-2 lg:grid-cols-4 gap-4">${[['2.4 lakh+','Active aspirants'],['18 lakh+','Tests attempted'],['350+','Mock tests'],['6','Exam categories']].map(([a, b]) => html`<div key=${b} class="card p-5"><dt class="font-display text-3xl font-extrabold text-acc tnum">${a}</dt><dd class="text-sm text-muted">${b}</dd></div>`)}</dl>
      <p class="text-xs text-muted mt-3">Sample figures for this prototype.</p><//>
    <section class="max-w-6xl mx-auto px-4 mt-14"><div class="card p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-5"><div><h2 class="text-2xl font-extrabold">Questions about a test or a plan?</h2><p class="text-muted">We reply within one working day.</p></div><div class="flex gap-3"><button class="btn btn-acc" onClick=${() => go('contact')}>Contact us</button><button class="btn btn-ghost" onClick=${() => go('exams')}>Browse tests</button></div></div></section>
  </div>`;
}

function Contact({ notify }) {
  const [f, setF] = useState({ name:'', email:'', topic:'Mock tests', msg:'' });
  const [t, setT] = useState({});
  const [sent, setSent] = useState(false);
  const E = {
    name: f.name.trim().length < 2 ? 'Enter your name' : '',
    email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email) ? 'Enter a valid email address' : '',
    msg: f.msg.trim().length < 10 ? 'Write at least 10 characters so we can help' : ''
  };
  const bad = Object.values(E).some(Boolean);
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const blur = k => () => setT(x => ({ ...x, [k]: true }));
  const submit = e => { e.preventDefault(); setT({ name:1, email:1, msg:1 }); if (!bad) setSent(true); };
  const F = ({ k, label, type = 'text', ph, area }) => html`<div class="flex flex-col gap-1.5"><label for=${'c-' + k} class="text-sm font-bold">${label}</label>
    ${area ? html`<textarea id=${'c-' + k} rows="5" class=${cx('field', t[k] && (E[k] ? 'err' : 'good'))} placeholder=${ph} value=${f[k]} onInput=${set(k)} onBlur=${blur(k)}></textarea>`
      : html`<input id=${'c-' + k} type=${type} class=${cx('field', t[k] && (E[k] ? 'err' : 'good'))} placeholder=${ph} value=${f[k]} onInput=${set(k)} onBlur=${blur(k)} />`}
    ${t[k] && E[k] && html`<p class="text-sm text-bad" role="alert">${E[k]}</p>`}</div>`;
  const copy = txt => { try { navigator.clipboard.writeText(txt).then(() => notify('Copied'), () => notify(txt)); } catch (e) { notify(txt); } };
  return html`<div class="max-w-6xl mx-auto px-4 pt-10 rise">
    <p class="text-xs font-bold uppercase tracking-widest text-acc">Contact us</p>
    <h1 class="text-3xl sm:text-4xl font-extrabold mt-1">We are here to help</h1>
    <div class="grid gap-6 mt-8 lg:grid-cols-[1.2fr_.8fr] items-start">
      <div class="card p-6 sm:p-8">${sent ? html`<div class="text-center py-8 pop"><span class="w-14 h-14 rounded-full bg-oksoft text-ok grid place-items-center mx-auto"><${Icon} n="check" s=${28} /></span><h2 class="text-xl font-extrabold mt-4">Message received (demo)</h2><p class="text-muted mt-1">In the live product we would reply to ${f.email} within one working day.</p><button class="btn btn-ghost mt-5" onClick=${() => { setSent(false); setF({ name:'', email:'', topic:'Mock tests', msg:'' }); setT({}); }}>Send another</button></div>`
        : html`<form class="grid gap-4" onSubmit=${submit} noValidate><h2 class="text-xl font-extrabold">Send us a message</h2>
          <div class="grid gap-4 sm:grid-cols-2">${F({ k:'name', label:'Your name', ph:'Aarti Kumari' })}${F({ k:'email', label:'Email', type:'email', ph:'you@example.com' })}</div>
          <label class="flex flex-col gap-1.5 text-sm font-bold" for="c-topic">Topic<select id="c-topic" class="field font-medium" value=${f.topic} onChange=${set('topic')}>${['Mock tests','Plans and payments','Technical problem','Suggest an exam','Something else'].map(o => html`<option key=${o}>${o}</option>`)}</select></label>
          ${F({ k:'msg', label:'Message', ph:'Tell us how we can help', area:true })}
          <button class="btn btn-acc self-start" type="submit">Send message <${Icon} n="arrow" s=${16} /></button></form>`}</div>
      <aside class="grid gap-4">
        <div class="card p-5 grid gap-4">${[['mail','Email','support@indiamocktests.example'],['clock','Support hours','Mon to Sat, 9 am to 7 pm IST'],['pin','Office','Patna, Bihar (sample address)']].map(([i, l, v]) => html`<div key=${l} class="flex gap-3"><span class="mega-ico shrink-0"><${Icon} n=${i} s=${18} /></span><div class="min-w-0"><p class="text-xs font-bold uppercase tracking-wide text-muted">${l}</p><p class="font-semibold break-words select-all">${v}</p>${i === 'mail' && html`<button class="text-sm font-semibold text-acc underline underline-offset-2" onClick=${() => copy(v)}>Copy address</button>`}</div></div>`)}</div>
        <div class="card px-5 divide-y divide-line"><h2 class="font-bold pt-5 pb-1">Quick answers</h2>
          ${[['Are the BPSC and STET mocks free?','Yes. The full mock for each is free, and sectional tests have a small fee.'],['Can I retake a test?','Free users can retake after 7 days. Paid plans allow unlimited retakes.'],['Which languages are supported?','The test screen works in Hindi and English. Question text follows the paper.']].map(([q, a]) => html`<details key=${q} class="faq"><summary>${q}<${Icon} n="chev" s=${18} cls="chev shrink-0 transition-transform" /></summary><p class="text-sm text-muted pb-4">${a}</p></details>`)}</div>
      </aside>
    </div>
  </div>`;
}

/* ---------- app ---------- */
function App() {
  const [view, setView] = useState({ name:'home', params:{} });
  const [user, setUser] = useState(null);
  const [lang, setLang] = useState('en');
  const [res, setRes] = useState(null);
  const [history, setHistory] = useState(HISTORY_SEED);
  const [bm, setBm] = useState([]);
  const [toast, setToast] = useState('');
  const go = (name, params = {}) => { setView({ name, params }); window.scrollTo({ top:0 }); };
  const notify = m => { setToast(m); setTimeout(() => setToast(''), 2600); };
  const toggleBm = id => setBm(b => b.includes(id) ? b.filter(x => x !== id) : [...b, id]);
  const ex = EXAMS.find(e => e.id === view.params.id) || EXAMS[0];
  const finish = (answers, used) => {
    const r = { ...evaluate(ex, answers, used), level: view.params.level };
    setRes(r);
    setHistory(h => [{ id:'n' + Date.now(), exam:ex.short, date:'2026-10-10', score:r.score, max:r.max, acc:r.acc, pct:r.pct }, ...h]);
    go('result');
  };
  const n = view.name;
  if (n === 'exam') return html`<${Exam} key=${ex.id + (view.params.level || '')} ex=${ex} lang=${lang} onFinish=${finish} level=${view.params.level} />`;
  return html`<div class="min-h-screen flex flex-col">
    <${Nav} route=${n} go=${go} user=${user} onLogout=${() => { setUser(null); go('home'); }} />
    <div class="flex-1 pb-4">
      ${n === 'home' && html`<${Home} go=${go} />`}
      ${n === 'exams' && html`<${Exams} key=${JSON.stringify(view.params)} go=${go} params=${view.params} />`}
      ${n === 'instructions' && html`<${Instructions} ex=${ex} go=${go} lang=${lang} setLang=${setLang} level=${view.params.level} />`}
      ${n === 'pyq' && html`<${Pyq} key=${JSON.stringify(view.params)} params=${view.params} go=${go} notify=${notify} />`}
      ${n === 'tutorials' && html`<${Tutorials} key=${view.params.type || 'all'} params=${view.params} go=${go} notify=${notify} />`}
      ${n === 'about' && html`<${About} go=${go} />`}
      ${n === 'contact' && html`<${Contact} notify=${notify} />`}
      ${n === 'result' && res && html`<${Result} res=${res} go=${go} bookmarks=${bm} toggleBm=${toggleBm} />`}
      ${n === 'dashboard' && html`<${Dashboard} user=${user} history=${history} bookmarks=${bm} go=${go} toggleBm=${toggleBm} />`}
      ${n === 'pricing' && html`<${Pricing} go=${go} user=${user} />`}
      ${(n === 'login' || n === 'register') && html`<${Auth} key=${n} mode=${n} go=${go} notify=${notify} onAuth=${u => { setUser(u); notify('Welcome, ' + u.name.split(' ')[0]); go('dashboard'); }} />`}
    </div>
    <${Footer} go=${go} />
    ${toast && html`<div class="fixed left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-hero text-white text-sm font-semibold shadow-xl pop" style=${{ bottom:'calc(1.5rem + env(safe-area-inset-bottom, 0px))', maxWidth:'90vw' }} role="status">${toast}</div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</body></html>
